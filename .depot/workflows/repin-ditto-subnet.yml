# Depot CI Migration
# Source: .github/workflows/repin-ditto-subnet.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: Repin DittoBench API in ditto-subnet
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repin-dittobench-api-in-ditto-subnet
  cancel-in-progress: true
jobs:
  repin:
    name: Open or refresh ditto-subnet repin PR
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    env:
      GH_TOKEN: ${{ secrets.DITTO_SUBNET_AUTOMATION_TOKEN }}
      TARGET_REPOSITORY: ditto-assistant/ditto-subnet
      UPDATE_BRANCH: automation/repin-dittobench-api
    steps:
      - name: Require the cross-repository token
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "Missing DITTO_SUBNET_AUTOMATION_TOKEN Actions secret" >&2
            exit 1
          fi
      - name: Clone current ditto-subnet main
        id: clone
        run: |
          gh auth setup-git
          gh repo clone "$TARGET_REPOSITORY" target -- --branch main --single-branch
          git -C target config user.name "ditto-repin-bot"
          git -C target config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          expected_old_sha="$({
            git -C target ls-remote --heads origin "refs/heads/$UPDATE_BRANCH" || true
          } | awk '{print $1}')"
          echo "expected_old_sha=$expected_old_sha" >> "$GITHUB_OUTPUT"
          git -C target checkout -b "$UPDATE_BRANCH"
      - name: Update the immutable DittoBench pin
        id: update
        env:
          API_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          api_sha = os.environ["API_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", api_sha):
              raise SystemExit(f"invalid API_SHA: {api_sha!r}")

          compose_path = Path("target/docker-compose.yml")
          compose = compose_path.read_text()
          match = re.search(
              r"x-dittobench-build-context:.*"
              r"ref=refs/heads/main&checksum=([0-9a-f]{40})",
              compose,
          )
          if match is None:
              raise SystemExit("could not find the immutable dittobench-api main pin")

          old_sha = match.group(1)
          if old_sha == api_sha:
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("changed=false\n")
              raise SystemExit(0)

          occurrences = compose.count(old_sha)
          if occurrences != 4:
              raise SystemExit(
                  f"expected the old DittoBench SHA four times, found {occurrences}"
              )
          compose_path.write_text(compose.replace(old_sha, api_sha))

          test_path = Path("target/ditto/tests/test_compose_stack.py")
          test_source = test_path.read_text()
          old_assertion = f'assert checksum == "{old_sha}"'
          if test_source.count(old_assertion) != 1:
              raise SystemExit("expected one exact-pin regression assertion")
          test_path.write_text(
              test_source.replace(
                  old_assertion,
                  f'assert checksum == "{api_sha}"',
              )
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("changed=true\n")
              output.write(f"old_sha={old_sha}\n")
          PY
      - name: Set up uv
        if: steps.update.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v6
      - name: Run focused compose validation
        if: steps.update.outputs.changed == 'true'
        working-directory: target
        run: |
          uv run pytest ditto/tests/test_compose_stack.py -q
          RELAY_API_KEY=validation-placeholder docker compose config --quiet
      - name: Verify clean remote BuildKit contexts
        if: steps.update.outputs.changed == 'true'
        working-directory: target
        run: |
          builder="ditto-repin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker buildx rm "$builder" >/dev/null 2>&1 || true' EXIT
          docker buildx create --name "$builder" --driver docker-container --use

          context="https://github.com/ditto-assistant/dittobench-api.git?ref=refs/heads/main&checksum=${GITHUB_SHA}"
          docker buildx build --builder "$builder" --no-cache --target relay "$context"
          docker buildx build --builder "$builder" --no-cache --target sandbox "$context"
      - name: Commit and push the update branch
        if: steps.update.outputs.changed == 'true'
        env:
          EXPECTED_OLD_SHA: ${{ steps.clone.outputs.expected_old_sha }}
        working-directory: target
        run: |
          git add docker-compose.yml ditto/tests/test_compose_stack.py
          git commit -m "fix: repin dittobench api to ${GITHUB_SHA}"

          if [[ -n "$EXPECTED_OLD_SHA" ]]; then
            git push \
              --force-with-lease="refs/heads/$UPDATE_BRANCH:$EXPECTED_OLD_SHA" \
              origin "HEAD:refs/heads/$UPDATE_BRANCH"
          else
            git push --set-upstream origin "HEAD:refs/heads/$UPDATE_BRANCH"
          fi
      - name: Open or refresh the draft PR
        if: steps.update.outputs.changed == 'true'
        env:
          OLD_SHA: ${{ steps.update.outputs.old_sha }}
        run: |
          open_pr="$(gh pr list \
            --repo "$TARGET_REPOSITORY" \
            --state open \
            --head "$UPDATE_BRANCH" \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$open_pr" ]]; then
            gh api \
              --method PATCH \
              "repos/$TARGET_REPOSITORY/pulls/$open_pr" \
              -f title="fix: repin dittobench api" \
              -f body="Automated repin of dittobench-api main from \`$OLD_SHA\` to \`$GITHUB_SHA\`." \
              >/dev/null
            echo "Refreshed $TARGET_REPOSITORY#$open_pr"
          else
            gh pr create \
              --repo "$TARGET_REPOSITORY" \
              --base main \
              --head "$UPDATE_BRANCH" \
              --draft \
              --title "fix: repin dittobench api" \
              --body "Automated repin of dittobench-api main from \`$OLD_SHA\` to \`$GITHUB_SHA\`."
          fi
