name: Import secrets and variables to Depot CI
on: push

permissions:
  id-token: write
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: depot/setup-action@v1
      - name: Import secrets
        env:
          DITTO_SUBNET_AUTOMATION_TOKEN: ${{ secrets.DITTO_SUBNET_AUTOMATION_TOKEN }}
        run: |
          unset DEPOT_TOKEN
          depot ci secrets add DITTO_SUBNET_AUTOMATION_TOKEN="$DITTO_SUBNET_AUTOMATION_TOKEN" --repo ditto-assistant/dittobench-api
