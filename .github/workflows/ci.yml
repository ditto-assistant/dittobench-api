name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: us-central1-docker.pkg.dev/ditto-app-dev/cloud-run-source-deploy/dittobench-api

jobs:
  test:
    name: build · vet · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # Build the production image on every PR — WITHOUT pushing or deploying. The
  # test job above builds with cgo enabled (the runner default), but the deployed
  # image builds in Docker (currently a static cgo/musl build for tree-sitter); a
  # Dockerfile/cgo break passes `go build` yet fails the image build, which used
  # to silently skip the deploy (deploy `needs: test`, not the image build). This
  # reproduces the deploy's image build so that break fails the PR instead. On
  # push to main the deploy job builds+pushes the image anyway, so this is
  # PR-only to avoid a redundant build there.
  docker-build:
    name: docker image builds (${{ matrix.target }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # ditto-subnet's release workflow builds `sandbox` (the scorer) and
        # `relay` (the model-pinning gateway); Cloud Run deploys `runtime`.
        target: [runtime, sandbox, relay]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          load: false

  # The linker SILENTLY ignores `-X <path>.<var>` when the path is wrong, so a
  # renamed package or a mistyped ldflag would stop embedding provenance without
  # breaking any build — and the scorer would quietly fall back to the
  # operator-asserted DITTOBENCH_SOURCE_SHA, which is exactly the failure this
  # mechanism exists to prevent. Prove end-to-end that a built image reports the
  # revision it was compiled with.
  provenance:
    name: image reports its own source revision
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build the scorer image with a stamped identity
        uses: docker/build-push-action@v6
        with:
          context: .
          target: sandbox
          push: false
          load: true
          tags: dittobench-api:provenance-ci
          build-args: |
            DITTOBENCH_SOURCE_SHA=${{ github.event.pull_request.head.sha }}
            DITTOBENCH_SOFTWARE_VERSION=ci-${{ github.run_id }}
      - name: The binary must report the revision it was built from
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A conflicting environment variable must lose to the compiled value
          # and be surfaced as a mismatch.
          report="$(docker run --rm \
            -e DITTOBENCH_SOURCE_SHA=0000000000000000000000000000000000000001 \
            dittobench-api:provenance-ci version -json)"
          echo "$report"
          test "$(jq -r .source_revision <<<"$report")" = "$EXPECTED_SHA"
          test "$(jq -r .source_revision_origin <<<"$report")" = binary
          test "$(jq -r .source_revision_mismatch <<<"$report")" = true
          test "$(jq -r .software_version <<<"$report")" = "ci-${{ github.run_id }}"
          # Without a conflicting variable there is nothing to flag.
          clean="$(docker run --rm dittobench-api:provenance-ci version -json)"
          test "$(jq -r .source_revision_mismatch <<<"$clean")" = false

  # Auto-deploy to Cloud Run on merge to main. Authenticates via the org's
  # Workload Identity Federation (same provider/SA the backend uses); no secrets.
  deploy:
    name: deploy to Cloud Run
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/22790208601/locations/global/workloadIdentityPools/github/providers/github-actions'
          service_account: 'github-actions-deploy@ditto-app-dev.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Stamp the commit into the binary so the deployed image can answer
          # `version` truthfully. DITTOBENCH_SOFTWARE_VERSION is deliberately
          # left unset: hosted practice has no release descriptor to bind to, so
          # /v1/capabilities keeps failing closed exactly as it does today.
          build-args: |
            DITTOBENCH_SOURCE_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy dittobench-api \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --project ditto-app-dev --region us-central1 \
            --allow-unauthenticated \
            --memory 1Gi --cpu 1 --timeout 3600 \
            --set-env-vars GENERATOR_MODEL=google/gemini-3.1-flash-lite,SCORER_MODEL=google/gemini-3.1-flash-lite \
            --quiet
